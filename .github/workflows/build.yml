name: Build Debian rootfs

on: [push]

jobs:
  debian-rootfs:
    strategy:
      matrix:
        target_arch: [i386, armhf, arm64, amd64, riscv64]

    name: Build Debian rootfs
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libarchive-tools wget arch-install-scripts git qemu-user-static binfmt-support debian-archive-keyring debian-ports-archive-keyring

      - name: Install debootstrap
        run: wget https://mirror.netcologne.de/ubuntu/pool/main/d/debootstrap/debootstrap_1.0.134ubuntu1_all.deb && sudo dpkg -i debootstrap_1.0.134ubuntu1_all.deb

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Git config
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set DEBIAN_SNAPSHOT variable
        run: echo "DEBIAN_SNAPSHOT=20240823T164440Z" >> $GITHUB_ENV

      - name: Rebuild
        run: |
          set -ex

          sudo mkdir debian-rootfs-${{matrix.target_arch}}
          case "${{matrix.target_arch}}" in
              amd64|i386)
                  sudo debootstrap --arch=${{matrix.target_arch}} sid debian-rootfs-${{matrix.target_arch}} https://snapshot.debian.org/archive/debian/$DEBIAN_SNAPSHOT/
                  ;;
              *)
                  sudo debootstrap --arch=${{matrix.target_arch}} --foreign sid debian-rootfs-${{matrix.target_arch}} https://snapshot.debian.org/archive/debian/$DEBIAN_SNAPSHOT/
                  ;;
          esac
          sudo rm -f debian-rootfs-${{matrix.target_arch}}/dev/{console,full,null,ptmx,random,tty,urandom,zero}

          case "${{matrix.target_arch}}" in
              amd64|i386)
                  ;;
              *)
                  ( sudo arch-chroot debian-rootfs-${{matrix.target_arch}} /debootstrap/debootstrap --second-stage || sudo cat debian-rootfs-${{matrix.target_arch}}/debootstrap/debootstrap.log ) && false
                  ;;
          esac

          sudo bsdtar -zcf debian-rootfs-${{matrix.target_arch}}.tar.gz debian-rootfs-${{matrix.target_arch}}

          sudo chown $(id -u):$(id -g) debian-rootfs-${{matrix.target_arch}}.tar.gz
      - name: Tag new release
        run: ( git tag $DEBIAN_SNAPSHOT && git push --tags ) || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Debian rootfs ${{ env.DEBIAN_SNAPSHOT }}
          tag_name: ${{ env.DEBIAN_SNAPSHOT }}
          body: Debian rootfs images for various ISAs based on snapshot ${{ env.DEBIAN_SNAPSHOT }}
          files: |
            debian-rootfs-${{matrix.target_arch}}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
